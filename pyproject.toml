[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "agri3d"
version = "0.1.0"
description = "3D crop perception and structural phenotyping for field-grown maize point clouds"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "plyfile>=1.0", "torch>=2.2", "scipy>=1.10", "PyYAML>=6.0"]
[project.optional-dependencies]
geometry = ["open3d>=0.18", "scikit-learn>=1.3"]
visualization = ["plotly", "matplotlib", "seaborn", "pandas"]
analysis = ["openpyxl>=3.1", "plotly>=5.18"]
data = ["huggingface-hub"]
interoperability = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.3"]
dev = ["pytest>=8", "ruff>=0.9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Repository = "https://github.com/GuilhermeFrAlmeida/agri3d-crop-phenotyping"
Documentation = "https://github.com/GuilhermeFrAlmeida/agri3d-crop-phenotyping/blob/main/docs/README.md"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Correctness gate; legacy formatting is outside this release-hardening change.
select = ["E9", "F"]
