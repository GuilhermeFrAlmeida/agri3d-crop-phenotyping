[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "agri3d"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "plyfile>=1.0", "torch>=2.2", "scipy>=1.10", "PyYAML>=6.0"]
[project.optional-dependencies]
geometry = ["open3d>=0.18", "scikit-learn>=1.3"]
visualization = ["plotly", "matplotlib", "seaborn", "pandas"]
analysis = ["openpyxl>=3.1", "plotly>=5.18"]
data = ["huggingface-hub"]
dev = ["pytest>=8", "ruff>=0.9"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
