# Instance graph frozen by the bounded Phase 4A five-plant diagnostic for val78.
# Val78 is evaluation only: do not tune these thresholds on its results.
coordinate_units: m
vertical_axis: z
seed: 42
projection: nearest_neighbor
instances:
  method: geometric_graph_v1
  neighborhood_radius_m: 0.020
  max_neighbors: 32
  min_leaf_points: 100
  attachment_radius_m: 0.03
phenotypes:
  voxel_size_m: 0.01
  geodesic: true
  geodesic_voxel_size_m: 0.01
  geodesic_radius_m: 0.03
  geodesic_neighbors: 8
  geodesic_max_nodes: 2048
