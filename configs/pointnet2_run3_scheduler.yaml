# Run 3: Run 1 plus validation-mIoU plateau scheduling only.
points: 10000
epochs: 100
batch_size: 2
lr: 0.001
seed: 42
num_workers: 0
device: auto
overfit_samples: 0
model:
  npoints: [1024, 256, 64, 16]
  radii: [0.1, 0.2, 0.4, 0.8]
  nsamples: [32, 32, 32, 32]
  chunk_size: 128
scheduler:
  enabled: true
  name: reduce_on_plateau
  mode: max
  factor: 0.5
  patience: 8
  threshold: 0.0005
  threshold_mode: abs
  min_lr: 0.00001
  cooldown: 0
  eps: 0.00000001
