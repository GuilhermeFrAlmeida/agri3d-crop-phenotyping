name: tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Open3D Linux runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
      - name: Install CPU package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,geometry,analysis]'
      - name: Verify geometry runtime
        run: python -c "import open3d; print(open3d.__version__)"
      - name: Ruff correctness checks
        run: python -m ruff check .
      - name: Synthetic tests and notebook smoke tests
        run: python -m pytest -q
